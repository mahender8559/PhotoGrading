services:
  photograding:
    build:
      context: .
      dockerfile: Dockerfile
    image: photograding:0.2
    container_name: photograding
    restart: unless-stopped
    init: true
    ports:
      - "${PHOTOGRADING_PORT:-8501}:8501"
    environment:
      PHOTOGRADING_DATA_DIR: /data
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "512"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      HOME: /tmp
      STREAMLIT_CONFIG_DIR: /tmp/.streamlit
    volumes:
      - photograding_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  photograding_data:
